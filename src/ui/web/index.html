<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>CodeSpec UI</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside id="sidebar" class="sidebar">
        <header class="sidebar-header">
          <div class="brand">CodeSpec <em>UI</em></div>
          <div class="project-meta">
            <span id="project-name">当前工程</span>
          </div>
        </header>
        <div id="project-tree" class="project-tree"></div>
        <div class="sidebar-tools">
          <button id="theme-toggle" class="icon-button" type="button" aria-label="切换主题" title="切换主题"></button>
          <button id="command-helper" class="icon-button" type="button" aria-label="打开命令助手" title="命令助手">⌘</button>
        </div>
      </aside>
      <button id="sidebar-toggle" class="sidebar-drawer-toggle" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="打开工程树" title="打开工程树">☰</button>
      <section class="workspace-shell">
        <header class="workspace-header">
          <label class="global-search">
            <span class="sr-only">搜索</span>
            <input id="search" type="search" placeholder="搜索 Change、Spec 和计划">
          </label>
          <button id="rebuild" class="quiet-button" type="button">重新扫描</button>
        </header>
        <main id="workspace" class="workspace" aria-live="polite">
          <section id="page" class="page"></section>
        </main>
      </section>
    </div>
    <script src="/vendor/markdown-it.min.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
