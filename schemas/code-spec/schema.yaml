name: code-spec
version: 1
description: 用于管理代码变更的 OpenSpec 工作流
# Protocol tokens: ADDED MODIFIED REMOVED Previous New Reason GIVEN WHEN THEN ERROR
# Every canonical Scenario requires an ERROR row. It may be blank while being analyzed,
# but VERIFY and archive must reject it until a human fills in the exception handling.
# Canonical paths: archive/specs and archive/changes
artifacts:
  - id: metadata
    generates: metadata.yaml
    description: 记录变更信息和当前状态
    template: metadata.yaml
    requires: []
  - id: proposal
    generates: proposal.md
    description: 说明为什么改、改哪些模块
    template: proposal.md
    requires: [metadata]
  - id: design
    generates: design.md
    description: 说明怎么实现
    template: design.md
    requires: [proposal]
  - id: spec
    generates: spec.md
    description: 记录需求变更
    template: spec.md
    requires: [proposal]
  - id: tasks
    generates: tasks.md
    description: 列出实现任务及完成情况
    template: tasks.md
    requires: [design, spec]
  - id: verification
    generates: verification.md
    description: 记录测试、构建和 lint 结果
    template: verification.md
    requires: [tasks]
apply:
  requires: [metadata, proposal, design, spec, tasks, verification]
  tracks: tasks.md
  instruction: 使用 metadata.yaml 作为状态权威；每个 SP-## 都记录 RED、GREEN 与回归证据。
