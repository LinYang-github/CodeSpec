name: code-spec
version: 1
description: 用于管理代码变更的 CodeSpec 工作流
# Protocol tokens: ADDED MODIFIED REMOVED Previous New Reason GIVEN WHEN THEN ERROR
# Every canonical Scenario requires an ERROR row. It may be blank while being analyzed,
# but VERIFY and archive must reject it until a human fills in the exception handling.
# Canonical paths: specs/<module> and root business/configuration YAML
artifacts:
  - id: metadata
    generates: metadata.yaml
    description: 记录变更信息和当前状态
    template: metadata.yaml
    requires: []
  - id: design
    generates: design.md
    description: 说明怎么实现
    template: design.md
    requires: [metadata]
  - id: spec
    generates: spec.md
    description: 记录需求变更
    template: spec.md
    requires: [metadata]
  - id: tasks
    generates: tasks.yaml
    description: 列出实现任务及完成情况
    template: tasks.yaml
    requires: [design, spec]
  - id: verification
    generates: verification.yaml
    description: 记录测试、构建和 lint 结果
    template: verification.yaml
    requires: [tasks]
apply:
  requires: [metadata, design, spec, tasks, verification]
  tracks: tasks.yaml
  instruction: 使用 metadata.yaml 作为状态权威；每个 CHG-YYYYMMDD-NNN-TASK-## 都记录任务、验证计划与回归证据。
