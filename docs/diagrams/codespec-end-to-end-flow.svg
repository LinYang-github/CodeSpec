<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 940" width="1600" height="940"
     data-diagram-type="process-flow" data-quality-profile="standard">
  <defs>
    <marker id="arrow-main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-method" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-recovery" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#dc2626"/>
    </marker>
    <marker id="arrow-artifact" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .title { font-size: 34px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 15px; fill: #64748b; }
    .lane { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; }
    .node-title { font-size: 17px; font-weight: 700; fill: #111827; }
    .node-sub { font-size: 12px; fill: #64748b; }
    .step { font-size: 12px; font-weight: 700; }
    .edge-label { font-size: 12px; font-weight: 600; fill: #475569; }
    .artifact { font-size: 13px; font-weight: 700; fill: #334155; }
    .artifact-sub { font-size: 11px; fill: #64748b; }
    .note { font-size: 12px; fill: #64748b; }
  </style>

  <rect data-graph-role="background" width="1600" height="940" fill="#ffffff"/>
  <text x="800" y="58" text-anchor="middle" class="title">CodeSpec 端到端开发流程</text>
  <text x="800" y="88" text-anchor="middle" class="subtitle">CodeSpec Core 管理 Change、状态与门禁 · Superpowers 提供分析、实现与验证方法</text>

  <g id="main-lane" data-graph-role="container" data-graph-bounds="48,126,1552,434">
    <rect data-graph-role="decoration" x="48" y="126" width="1504" height="308" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="8,6"/>
    <text x="72" y="154" class="lane" fill="#2563eb">正常开发主线</text>
  </g>

  <g id="recovery-lane" data-graph-role="container" data-graph-bounds="48,478,1552,706">
    <rect data-graph-role="decoration" x="48" y="478" width="1504" height="228" rx="18" fill="#fffafa" stroke="#fecaca" stroke-width="1.5" stroke-dasharray="8,6"/>
    <text x="72" y="506" class="lane" fill="#dc2626">恢复与人工门禁</text>
  </g>

  <g id="artifact-lane" data-graph-role="container" data-graph-bounds="48,748,1552,872">
    <rect data-graph-role="decoration" x="48" y="748" width="1504" height="124" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="72" y="776" class="lane" fill="#475569">CANONICAL CHANGE 产物</text>
  </g>

  <!-- Main flow edges -->
  <path data-graph-role="edge" data-source="workflow" data-target="analyze" d="M290 282 H326" fill="none" stroke="#2563eb" stroke-width="2.6" marker-end="url(#arrow-main)"/>
  <path data-graph-role="edge" data-source="analyze" data-target="plan" d="M532 282 H568" fill="none" stroke="#7c3aed" stroke-width="2.6" marker-end="url(#arrow-method)"/>
  <path data-graph-role="edge" data-source="plan" data-target="implement" d="M774 282 H810" fill="none" stroke="#2563eb" stroke-width="2.6" marker-end="url(#arrow-main)"/>
  <path data-graph-role="edge" data-source="implement" data-target="verify" d="M1016 282 H1052" fill="none" stroke="#7c3aed" stroke-width="2.6" marker-end="url(#arrow-method)"/>
  <path data-graph-role="edge" data-source="verify" data-target="archive" d="M1258 282 H1294" fill="none" stroke="#2563eb" stroke-width="2.6" marker-end="url(#arrow-main)"/>

  <!-- Recovery edges: all use separate open corridors -->
  <path data-graph-role="edge" data-source="workflow" data-target="rebase" d="M187 336 V552" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="7,5" marker-end="url(#arrow-recovery)"/>
  <path data-graph-role="edge" data-source="rebase" data-target="workflow" d="M84 596 H68 V196 H84" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="7,5" marker-end="url(#arrow-recovery)"/>
  <path data-graph-role="edge" data-source="verify" data-target="debug" d="M1155 336 V552" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="7,5" marker-end="url(#arrow-recovery)"/>
  <path data-graph-role="edge" data-source="debug" data-target="implement" d="M1040 596 H913 V336" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="7,5" marker-end="url(#arrow-recovery)"/>
  <path data-graph-role="edge" data-source="archive" data-target="pending" d="M1397 336 V552" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="7,5" marker-end="url(#arrow-recovery)"/>

  <!-- Artifact dependency edges -->
  <path data-graph-role="edge" data-source="metadata" data-target="design" d="M348 816 H388" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow-artifact)"/>
  <path data-graph-role="edge" data-source="design" data-target="spec" d="M624 816 H664" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow-artifact)"/>
  <path data-graph-role="edge" data-source="spec" data-target="tasks" d="M900 816 H940" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow-artifact)"/>
  <path data-graph-role="edge" data-source="tasks" data-target="verification" d="M1176 816 H1216" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow-artifact)"/>

  <!-- Main nodes -->
  <g id="workflow" data-graph-role="node" data-node-id="workflow" data-graph-bounds="84,196,290,336">
    <rect x="84" y="196" width="206" height="140" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.2"/>
    <circle cx="112" cy="222" r="15" fill="#2563eb"/><text x="112" y="227" text-anchor="middle" class="step" fill="#ffffff">1</text>
    <text x="187" y="246" text-anchor="middle" class="node-title">进入 workflow</text>
    <text x="187" y="272" text-anchor="middle" class="node-sub">解析或创建 Change</text>
    <text x="187" y="294" text-anchor="middle" class="node-sub">分配模块与 Requirement ID</text>
    <text x="187" y="316" text-anchor="middle" class="node-sub">捕获 Baseline / 检查 STALE</text>
  </g>
  <g id="analyze" data-graph-role="node" data-node-id="analyze" data-graph-bounds="326,196,532,336">
    <rect x="326" y="196" width="206" height="140" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2.2"/>
    <circle cx="354" cy="222" r="15" fill="#7c3aed"/><text x="354" y="227" text-anchor="middle" class="step" fill="#ffffff">2</text>
    <text x="429" y="246" text-anchor="middle" class="node-title">分析与设计</text>
    <text x="429" y="272" text-anchor="middle" class="node-sub">brainstorming</text>
    <text x="429" y="294" text-anchor="middle" class="node-sub">目标、范围、边界、方案</text>
    <text x="429" y="316" text-anchor="middle" class="node-sub">人工确认设计方向</text>
  </g>
  <g id="plan" data-graph-role="node" data-node-id="plan" data-graph-bounds="568,196,774,336">
    <rect x="568" y="196" width="206" height="140" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2.2"/>
    <circle cx="596" cy="222" r="15" fill="#f97316"/><text x="596" y="227" text-anchor="middle" class="step" fill="#ffffff">3</text>
    <text x="671" y="246" text-anchor="middle" class="node-title">规格与计划</text>
    <text x="671" y="272" text-anchor="middle" class="node-sub">Requirement + Scenario</text>
    <text x="671" y="294" text-anchor="middle" class="node-sub">GIVEN / WHEN / THEN / ERROR</text>
    <text x="671" y="316" text-anchor="middle" class="node-sub">tasks.yaml + 验证计划</text>
  </g>
  <g id="implement" data-graph-role="node" data-node-id="implement" data-graph-bounds="810,196,1016,336">
    <rect x="810" y="196" width="206" height="140" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.2"/>
    <circle cx="838" cy="222" r="15" fill="#16a34a"/><text x="838" y="227" text-anchor="middle" class="step" fill="#ffffff">4</text>
    <text x="913" y="246" text-anchor="middle" class="node-title">TDD 实现</text>
    <text x="913" y="272" text-anchor="middle" class="node-sub">RED → GREEN → REFACTOR</text>
    <text x="913" y="294" text-anchor="middle" class="node-sub">逐 Task 实现并刷新状态</text>
    <text x="913" y="316" text-anchor="middle" class="node-sub">保持需求—代码可追踪</text>
  </g>
  <g id="verify" data-graph-role="node" data-node-id="verify" data-graph-bounds="1052,196,1258,336">
    <rect x="1052" y="196" width="206" height="140" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/>
    <circle cx="1080" cy="222" r="15" fill="#0f766e"/><text x="1080" y="227" text-anchor="middle" class="step" fill="#ffffff">5</text>
    <text x="1155" y="246" text-anchor="middle" class="node-title">Fresh 验证</text>
    <text x="1155" y="272" text-anchor="middle" class="node-sub">测试 · 构建 · lint</text>
    <text x="1155" y="294" text-anchor="middle" class="node-sub">Scenario / Traceability 覆盖</text>
    <text x="1155" y="316" text-anchor="middle" class="node-sub">写入 verification.yaml</text>
  </g>
  <g id="archive" data-graph-role="node" data-node-id="archive" data-graph-bounds="1294,196,1500,336">
    <rect x="1294" y="196" width="206" height="140" rx="12" fill="#ecfdf5" stroke="#15803d" stroke-width="2.2"/>
    <circle cx="1322" cy="222" r="15" fill="#15803d"/><text x="1322" y="227" text-anchor="middle" class="step" fill="#ffffff">6</text>
    <text x="1397" y="246" text-anchor="middle" class="node-title">人工确认归档</text>
    <text x="1397" y="272" text-anchor="middle" class="node-sub">preflight + 全部门禁</text>
    <text x="1397" y="294" text-anchor="middle" class="node-sub">事务应用 Delta</text>
    <text x="1397" y="316" text-anchor="middle" class="node-sub">更新 Current Specification</text>
  </g>

  <!-- Recovery nodes -->
  <g id="rebase" data-graph-role="node" data-node-id="rebase" data-graph-bounds="84,552,290,640">
    <rect x="84" y="552" width="206" height="88" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
    <text x="187" y="585" text-anchor="middle" class="node-title">rebase</text>
    <text x="187" y="610" text-anchor="middle" class="node-sub">重建 Baseline、裁决冲突</text>
    <text x="187" y="630" text-anchor="middle" class="node-sub">成功后重新进入 workflow</text>
  </g>
  <g id="debug" data-graph-role="node" data-node-id="debug" data-graph-bounds="1040,552,1270,640">
    <rect x="1040" y="552" width="230" height="88" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
    <text x="1155" y="585" text-anchor="middle" class="node-title">systematic-debugging</text>
    <text x="1155" y="610" text-anchor="middle" class="node-sub">复现失败、定位根因</text>
    <text x="1155" y="630" text-anchor="middle" class="node-sub">补回归测试后重新实现</text>
  </g>
  <g id="pending" data-graph-role="node" data-node-id="pending" data-graph-bounds="1294,552,1500,640">
    <rect x="1294" y="552" width="206" height="88" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/>
    <text x="1397" y="585" text-anchor="middle" class="node-title">保持未归档</text>
    <text x="1397" y="610" text-anchor="middle" class="node-sub">未确认就不写入当前规格</text>
    <text x="1397" y="630" text-anchor="middle" class="node-sub">Change 可继续修订</text>
  </g>

  <!-- Edge labels -->
  <text x="202" y="458" class="edge-label" fill="#dc2626">STALE / 冲突</text>
  <text x="1170" y="458" class="edge-label" fill="#dc2626">验证失败</text>
  <text x="1412" y="458" class="edge-label" fill="#dc2626">未确认</text>

  <!-- Artifact nodes -->
  <g id="metadata" data-graph-role="node" data-node-id="metadata" data-graph-bounds="112,792,348,840">
    <rect x="112" y="792" width="236" height="48" rx="8" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="230" y="812" text-anchor="middle" class="artifact">metadata.yaml</text><text x="230" y="830" text-anchor="middle" class="artifact-sub">状态与控制权威</text>
  </g>
  <g id="design" data-graph-role="node" data-node-id="design" data-graph-bounds="388,792,624,840">
    <rect x="388" y="792" width="236" height="48" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="506" y="812" text-anchor="middle" class="artifact">design.md</text><text x="506" y="830" text-anchor="middle" class="artifact-sub">边界、方案与技术决策</text>
  </g>
  <g id="spec" data-graph-role="node" data-node-id="spec" data-graph-bounds="664,792,900,840">
    <rect x="664" y="792" width="236" height="48" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
    <text x="782" y="812" text-anchor="middle" class="artifact">spec.md</text><text x="782" y="830" text-anchor="middle" class="artifact-sub">需求、场景与 Delta</text>
  </g>
  <g id="tasks" data-graph-role="node" data-node-id="tasks" data-graph-bounds="940,792,1176,840">
    <rect x="940" y="792" width="236" height="48" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="1058" y="812" text-anchor="middle" class="artifact">tasks.yaml</text><text x="1058" y="830" text-anchor="middle" class="artifact-sub">任务与验证计划</text>
  </g>
  <g id="verification" data-graph-role="node" data-node-id="verification" data-graph-bounds="1216,792,1452,840">
    <rect x="1216" y="792" width="236" height="48" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
    <text x="1334" y="812" text-anchor="middle" class="artifact">verification.yaml</text><text x="1334" y="830" text-anchor="middle" class="artifact-sub">新鲜执行证据</text>
  </g>

  <g id="legend" data-graph-role="legend">
    <line x1="72" y1="910" x2="106" y2="910" stroke="#2563eb" stroke-width="2.6" marker-end="url(#arrow-main)"/>
    <text x="118" y="914" class="note">CodeSpec Core / 主流程</text>
    <line x1="330" y1="910" x2="364" y2="910" stroke="#7c3aed" stroke-width="2.6" marker-end="url(#arrow-method)"/>
    <text x="376" y="914" class="note">Superpowers 工程方法</text>
    <line x1="624" y1="910" x2="658" y2="910" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="7,5" marker-end="url(#arrow-recovery)"/>
    <text x="670" y="914" class="note">恢复 / 人工门禁</text>
    <text x="1528" y="914" text-anchor="end" class="note">只有归档事务可以写入 Current Specification</text>
  </g>
</svg>
