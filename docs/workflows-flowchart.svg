<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 1320" width="1360" height="1320"
     data-diagram-type="process-flow" data-quality-profile="standard">
  <defs>
    <marker id="arrow-main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-recovery" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#ef4444"/>
    </marker>
    <marker id="arrow-artifact" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#64748b"/>
    </marker>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }
    .title { font-size: 30px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 14px; fill: #6b7280; }
    .section { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; fill: #2563eb; }
    .node-title { font-size: 16px; font-weight: 700; fill: #111827; }
    .node-sub { font-size: 12px; fill: #6b7280; }
    .edge-label { font-size: 12px; font-weight: 600; fill: #475569; }
    .artifact-title { font-size: 14px; font-weight: 700; fill: #111827; }
    .artifact-sub { font-size: 11px; fill: #6b7280; }
    .legend { font-size: 12px; fill: #64748b; }
    .footnote { font-size: 12px; fill: #64748b; }
  </style>

  <rect data-graph-role="background" width="1360" height="1320" fill="#ffffff"/>
  <text x="680" y="54" text-anchor="middle" class="title">CodeSpec 开发工作流</text>
  <text x="680" y="82" text-anchor="middle" class="subtitle">CodeSpec Core 管理状态与门禁 · Superpowers 管理工程方法</text>

  <g id="main-flow" data-graph-role="container" data-graph-bounds="360,112,760,1252">
    <rect data-graph-role="decoration" x="360" y="112" width="400" height="1140" rx="14" fill="#f8fafc" fill-opacity="0.72"
          stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="7,6"/>
    <text x="380" y="140" class="section">正常开发主线</text>
  </g>
  <g id="artifact-chain" data-graph-role="container" data-graph-bounds="900,136,1280,696">
    <rect data-graph-role="decoration" x="900" y="136" width="380" height="560" rx="14" fill="#f8fafc" fill-opacity="0.72"
          stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="7,6"/>
    <text x="920" y="164" class="section">CODESPEC 产物依赖顺序</text>
  </g>

  <!-- Main flow edges -->
  <path id="enter-context" data-graph-role="edge" data-source="workflow" data-target="baseline-gate"
        d="M560 216 L560 272" fill="none" stroke="#7c3aed" stroke-width="2.6" marker-end="url(#arrow-main)"/>
  <path id="baseline-ok" data-graph-role="edge" data-source="baseline-gate" data-target="brainstorm"
        d="M560 352 L560 408" fill="none" stroke="#7c3aed" stroke-width="2.6" marker-end="url(#arrow-main)"/>
  <path id="analysis-plan" data-graph-role="edge" data-source="brainstorm" data-target="plan"
        d="M560 472 L560 528" fill="none" stroke="#7c3aed" stroke-width="2.6" marker-end="url(#arrow-main)"/>
  <path id="plan-spec" data-graph-role="edge" data-source="plan" data-target="error-gate"
        d="M560 592 L560 648" fill="none" stroke="#7c3aed" stroke-width="2.6" marker-end="url(#arrow-main)"/>
  <path id="error-complete" data-graph-role="edge" data-source="error-gate" data-target="tdd"
        d="M560 728 L560 792" fill="none" stroke="#7c3aed" stroke-width="2.6" marker-end="url(#arrow-main)"/>
  <path id="implement-verify" data-graph-role="edge" data-source="tdd" data-target="verify"
        d="M560 856 L560 912" fill="none" stroke="#7c3aed" stroke-width="2.6" marker-end="url(#arrow-main)"/>
  <path id="verify-archive" data-graph-role="edge" data-source="verify" data-target="archive-gate"
        d="M560 976 L560 1032" fill="none" stroke="#7c3aed" stroke-width="2.6" marker-end="url(#arrow-main)"/>
  <path id="archive-yes" data-graph-role="edge" data-source="archive-gate" data-target="archived"
        d="M560 1112 L560 1160" fill="none" stroke="#7c3aed" stroke-width="2.6" marker-end="url(#arrow-main)"/>

  <!-- Recovery and human-gate branches -->
  <path id="baseline-stale" data-graph-role="edge" data-source="baseline-gate" data-target="rebase"
        d="M440 312 L320 312" fill="none" stroke="#ef4444" stroke-width="2.2" stroke-dasharray="7,5" marker-end="url(#arrow-recovery)"/>
  <path id="rebase-return" data-graph-role="edge" data-source="rebase" data-target="workflow"
        d="M200 280 L200 240 L360 240 L360 184 L430 184" fill="none" stroke="#ef4444" stroke-width="2.2"
        stroke-dasharray="7,5" stroke-linejoin="round" marker-end="url(#arrow-recovery)"/>
  <path id="error-missing" data-graph-role="edge" data-source="error-gate" data-target="complete-errors"
        d="M440 688 L320 688" fill="none" stroke="#ef4444" stroke-width="2.2" stroke-dasharray="7,5" marker-end="url(#arrow-recovery)"/>
  <path id="errors-to-tdd" data-graph-role="edge" data-source="complete-errors" data-target="tdd"
        d="M200 720 L200 824 L430 824" fill="none" stroke="#ef4444" stroke-width="2.2"
        stroke-dasharray="7,5" stroke-linejoin="round" marker-end="url(#arrow-recovery)"/>
  <path id="implement-failed" data-graph-role="edge" data-source="tdd" data-target="debug"
        d="M690 824 L800 824" fill="none" stroke="#ef4444" stroke-width="2.2" stroke-dasharray="7,5" marker-end="url(#arrow-recovery)"/>
  <path id="debug-to-verify" data-graph-role="edge" data-source="debug" data-target="verify"
        d="M920 856 L920 944 L690 944" fill="none" stroke="#ef4444" stroke-width="2.2"
        stroke-dasharray="7,5" stroke-linejoin="round" marker-end="url(#arrow-recovery)"/>
  <path id="archive-no" data-graph-role="edge" data-source="archive-gate" data-target="pending"
        d="M680 1072 L800 1072" fill="none" stroke="#ef4444" stroke-width="2.2" stroke-dasharray="7,5" marker-end="url(#arrow-recovery)"/>

  <!-- Artifact dependency edges -->
  <path id="artifact-1" data-graph-role="edge" data-source="metadata" data-target="proposal"
        d="M1090 240 L1090 276" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow-artifact)"/>
  <path id="artifact-2" data-graph-role="edge" data-source="proposal" data-target="design"
        d="M1090 324 L1090 360" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow-artifact)"/>
  <path id="artifact-3" data-graph-role="edge" data-source="design" data-target="spec"
        d="M1090 408 L1090 444" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow-artifact)"/>
  <path id="artifact-4" data-graph-role="edge" data-source="spec" data-target="tasks"
        d="M1090 492 L1090 528" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow-artifact)"/>
  <path id="artifact-5" data-graph-role="edge" data-source="tasks" data-target="verification"
        d="M1090 576 L1090 612" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow-artifact)"/>

  <!-- Main flow nodes -->
  <g id="workflow" data-graph-role="node" data-node-id="workflow" data-graph-bounds="430,152,690,216">
    <rect x="430" y="152" width="260" height="64" rx="10" fill="#faf5ff" stroke="#8b5cf6" stroke-width="2.4" filter="url(#soft-shadow)"/>
    <rect x="436" y="158" width="248" height="52" rx="7" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.55"/>
    <text x="560" y="180" text-anchor="middle" class="node-title">workflow</text>
    <text x="560" y="201" text-anchor="middle" class="node-sub">唯一正常开发入口</text>
  </g>
  <g id="baseline-gate" data-graph-role="node" data-node-id="baseline-gate" data-graph-bounds="440,272,680,352">
    <polygon points="560,272 680,312 560,352 440,312" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="560" y="307" text-anchor="middle" class="node-title">Baseline 安全？</text>
    <text x="560" y="328" text-anchor="middle" class="node-sub">Change 唯一且无未裁决冲突</text>
  </g>
  <g id="brainstorm" data-graph-role="node" data-node-id="brainstorm" data-graph-bounds="430,408,690,472">
    <rect x="430" y="408" width="260" height="64" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
    <text x="560" y="436" text-anchor="middle" class="node-title">分析需求</text>
    <text x="560" y="457" text-anchor="middle" class="node-sub">brainstorming：目标、范围、边界</text>
  </g>
  <g id="plan" data-graph-role="node" data-node-id="plan" data-graph-bounds="430,528,690,592">
    <rect x="430" y="528" width="260" height="64" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
    <text x="560" y="556" text-anchor="middle" class="node-title">形成方案</text>
    <text x="560" y="577" text-anchor="middle" class="node-sub">writing-plans：步骤、文件、验证</text>
  </g>
  <g id="error-gate" data-graph-role="node" data-node-id="error-gate" data-graph-bounds="440,648,680,728">
    <polygon points="560,648 680,688 560,728 440,688" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="560" y="683" text-anchor="middle" class="node-title">ERROR 完整？</text>
    <text x="560" y="704" text-anchor="middle" class="node-sub">Scenario 异常处理均非空</text>
  </g>
  <g id="tdd" data-graph-role="node" data-node-id="tdd" data-graph-bounds="430,792,690,856">
    <rect x="430" y="792" width="260" height="64" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/>
    <text x="560" y="820" text-anchor="middle" class="node-title">实现</text>
    <text x="560" y="841" text-anchor="middle" class="node-sub">TDD：RED → GREEN → REFACTOR</text>
  </g>
  <g id="verify" data-graph-role="node" data-node-id="verify" data-graph-bounds="430,912,690,976">
    <rect x="430" y="912" width="260" height="64" rx="10" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.8"/>
    <text x="560" y="940" text-anchor="middle" class="node-title">完成前验证</text>
    <text x="560" y="961" text-anchor="middle" class="node-sub">fresh tests · build · lint · traceability</text>
  </g>
  <g id="archive-gate" data-graph-role="node" data-node-id="archive-gate" data-graph-bounds="440,1032,680,1112">
    <polygon points="560,1032 680,1072 560,1112 440,1072" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="560" y="1067" text-anchor="middle" class="node-title">人工确认归档？</text>
    <text x="560" y="1088" text-anchor="middle" class="node-sub">preflight 与全部门禁已通过</text>
  </g>
  <g id="archived" data-graph-role="node" data-node-id="archived" data-graph-bounds="430,1160,690,1224">
    <rect x="430" y="1160" width="260" height="64" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.4" filter="url(#soft-shadow)"/>
    <rect x="436" y="1166" width="248" height="52" rx="7" fill="none" stroke="#16a34a" stroke-width="1" opacity="0.55"/>
    <text x="560" y="1188" text-anchor="middle" class="node-title">归档完成</text>
    <text x="560" y="1209" text-anchor="middle" class="node-sub">应用 Delta 并移入 archive</text>
  </g>

  <!-- Branch nodes -->
  <g id="rebase" data-graph-role="node" data-node-id="rebase" data-graph-bounds="80,280,320,344">
    <rect x="80" y="280" width="240" height="64" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
    <text x="200" y="308" text-anchor="middle" class="node-title">rebase</text>
    <text x="200" y="329" text-anchor="middle" class="node-sub">重建 Baseline 并裁决冲突</text>
  </g>
  <g id="complete-errors" data-graph-role="node" data-node-id="complete-errors" data-graph-bounds="80,656,320,720">
    <rect x="80" y="656" width="240" height="64" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
    <text x="200" y="684" text-anchor="middle" class="node-title">人工补写 ERROR</text>
    <text x="200" y="705" text-anchor="middle" class="node-sub">明确异常处理并重新校验</text>
  </g>
  <g id="debug" data-graph-role="node" data-node-id="debug" data-graph-bounds="800,792,1040,856">
    <rect x="800" y="792" width="240" height="64" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
    <text x="920" y="820" text-anchor="middle" class="node-title">系统化调试</text>
    <text x="920" y="841" text-anchor="middle" class="node-sub">定位根因并补充回归测试</text>
  </g>
  <g id="pending" data-graph-role="node" data-node-id="pending" data-graph-bounds="800,1040,1040,1104">
    <rect x="800" y="1040" width="240" height="64" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/>
    <text x="920" y="1068" text-anchor="middle" class="node-title">保持 Change 未归档</text>
    <text x="920" y="1089" text-anchor="middle" class="node-sub">不写 Current Specification</text>
  </g>

  <!-- Artifact nodes -->
  <g id="metadata" data-graph-role="node" data-node-id="metadata" data-graph-bounds="980,192,1200,240">
    <path d="M980 192 H1184 L1200 208 V240 H980 Z M1184 192 V208 H1200" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.6"/>
    <text x="1090" y="213" text-anchor="middle" class="artifact-title">metadata.yaml</text>
    <text x="1090" y="231" text-anchor="middle" class="artifact-sub">状态权威</text>
  </g>
  <g id="proposal" data-graph-role="node" data-node-id="proposal" data-graph-bounds="980,276,1200,324">
    <path d="M980 276 H1184 L1200 292 V324 H980 Z M1184 276 V292 H1200" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
    <text x="1090" y="297" text-anchor="middle" class="artifact-title">proposal.md</text>
    <text x="1090" y="315" text-anchor="middle" class="artifact-sub">原因与影响范围</text>
  </g>
  <g id="design" data-graph-role="node" data-node-id="design" data-graph-bounds="980,360,1200,408">
    <path d="M980 360 H1184 L1200 376 V408 H980 Z M1184 360 V376 H1200" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
    <text x="1090" y="381" text-anchor="middle" class="artifact-title">design.md</text>
    <text x="1090" y="399" text-anchor="middle" class="artifact-sub">实现方案与技术决策</text>
  </g>
  <g id="spec" data-graph-role="node" data-node-id="spec" data-graph-bounds="980,444,1200,492">
    <path d="M980 444 H1184 L1200 460 V492 H980 Z M1184 444 V460 H1200" fill="#fff7ed" stroke="#f97316" stroke-width="1.6"/>
    <text x="1090" y="465" text-anchor="middle" class="artifact-title">spec.md</text>
    <text x="1090" y="483" text-anchor="middle" class="artifact-sub">Requirement 与 Scenario</text>
  </g>
  <g id="tasks" data-graph-role="node" data-node-id="tasks" data-graph-bounds="980,528,1200,576">
    <path d="M980 528 H1184 L1200 544 V576 H980 Z M1184 528 V544 H1200" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.6"/>
    <text x="1090" y="549" text-anchor="middle" class="artifact-title">tasks.md</text>
    <text x="1090" y="567" text-anchor="middle" class="artifact-sub">SP-## 任务投影</text>
  </g>
  <g id="verification" data-graph-role="node" data-node-id="verification" data-graph-bounds="980,612,1200,660">
    <path d="M980 612 H1184 L1200 628 V660 H980 Z M1184 612 V628 H1200" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.6"/>
    <text x="1090" y="633" text-anchor="middle" class="artifact-title">verification.md</text>
    <text x="1090" y="651" text-anchor="middle" class="artifact-sub">新鲜验证证据</text>
  </g>

  <!-- Edge labels -->
  <g data-graph-role="decoration"><rect x="575" y="371" width="36" height="22" rx="6" fill="#ffffff" opacity="0.96"/><text x="593" y="386" text-anchor="middle" class="edge-label">安全</text></g>
  <g data-graph-role="decoration"><rect x="334" y="296" width="90" height="22" rx="6" fill="#ffffff" opacity="0.96"/><text x="379" y="311" text-anchor="middle" class="edge-label">STALE / 冲突</text></g>
  <g data-graph-role="decoration"><rect x="244" y="226" width="76" height="22" rx="6" fill="#ffffff" opacity="0.96"/><text x="282" y="241" text-anchor="middle" class="edge-label">重新进入</text></g>
  <g data-graph-role="decoration"><rect x="574" y="748" width="26" height="22" rx="6" fill="#ffffff" opacity="0.96"/><text x="587" y="763" text-anchor="middle" class="edge-label">是</text></g>
  <g data-graph-role="decoration"><rect x="350" y="674" width="26" height="22" rx="6" fill="#ffffff" opacity="0.96"/><text x="363" y="689" text-anchor="middle" class="edge-label">否</text></g>
  <g data-graph-role="decoration"><rect x="92" y="760" width="102" height="22" rx="6" fill="#ffffff" opacity="0.96"/><text x="143" y="775" text-anchor="middle" class="edge-label">补写后继续</text></g>
  <g data-graph-role="decoration"><rect x="694" y="799" width="102" height="22" rx="6" fill="#ffffff" opacity="0.96"/><text x="745" y="814" text-anchor="middle" class="edge-label">测试 / 构建失败</text></g>
  <g data-graph-role="decoration"><rect x="744" y="930" width="132" height="22" rx="6" fill="#ffffff" opacity="0.96"/><text x="810" y="945" text-anchor="middle" class="edge-label">修复后重新验证</text></g>
  <g data-graph-role="decoration"><rect x="574" y="1125" width="26" height="22" rx="6" fill="#ffffff" opacity="0.96"/><text x="587" y="1140" text-anchor="middle" class="edge-label">是</text></g>
  <g data-graph-role="decoration"><rect x="696" y="1056" width="98" height="22" rx="6" fill="#ffffff" opacity="0.96"/><text x="745" y="1071" text-anchor="middle" class="edge-label">取消 / 未确认</text></g>

  <!-- Legend and archive invariant -->
  <g id="legend" data-graph-role="legend">
    <line x1="820" y1="1182" x2="854" y2="1182" stroke="#7c3aed" stroke-width="2.6" marker-end="url(#arrow-main)"/>
    <text x="866" y="1186" class="legend">正常开发流</text>
    <line x1="968" y1="1182" x2="1002" y2="1182" stroke="#ef4444" stroke-width="2.2" stroke-dasharray="7,5" marker-end="url(#arrow-recovery)"/>
    <text x="1014" y="1186" class="legend">人工门禁 / 恢复回路</text>
    <line x1="820" y1="1214" x2="854" y2="1214" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow-artifact)"/>
    <text x="866" y="1218" class="legend">产物依赖</text>
  </g>
  <line x1="72" y1="1270" x2="1288" y2="1270" stroke="#e2e8f0" stroke-width="1"/>
  <text x="72" y="1296" class="footnote">仅 archive 事务可写入 Current Specification；首次归档确认不得由 AI 或 --yes 绕过。</text>
</svg>
